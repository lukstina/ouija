server {
    listen 80;
    server_name other-side.lukstins.com;

    location /.well-known/acme-challenge/ {
        root /var/www/ouija-acme;
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name other-side.lukstins.com;
    ssl_certificate /etc/nginx/ssl/ouija/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/ouija/privkey.pem;

    location = /api/oracle {
        limit_req zone=ouija_api burst=3 nodelay;
        limit_req_status 429;
        client_max_body_size 4k;
        proxy_pass http://127.0.0.1:3001;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 20s;
    }

    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
