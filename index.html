<!doctype html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><meta name="theme-color" content="#16131d"><title>Ouija · Ask the unknown</title></head>
<body><main id="app"><header><p class="eyebrow">A little mystery</p><h1>Ask the unknown.</h1><p>Leave a question. Follow the letters.</p></header><section class="board" aria-label="Ouija board"><div class="ends"><span>YES</span><span>☾</span><span>NO</span></div><div id="letters" aria-hidden="true"></div><div class="goodbye">GOOD BYE</div><div id="planchette" aria-hidden="true">◉</div></section><form id="question-form"><label for="question">What would you like to ask?</label><div class="input-row"><input id="question" name="question" maxlength="300" placeholder="What does tomorrow hold?" autocomplete="off" required><button id="ask" type="submit">Ask the board</button></div><p class="hint">Use your keyboard’s dictation button to speak your question. Demo replies · for entertainment.</p></form><section class="answer-panel"><p class="eyebrow">The board says</p><p id="answer" aria-hidden="true">Your answer will appear here.</p><p id="announcement" class="sr-only" role="status" aria-live="polite"></p><button id="skip" type="button" hidden>Reveal answer</button></section></main><script type="module" src="/src/main.js"></script></body>
</html>
