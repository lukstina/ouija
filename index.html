<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#16131d">
  <title>Bite Halloween</title>
</head>
<body>
  <main id="app">
    <header><h1>Bite Halloween</h1></header>
    <section class="board" aria-label="Ouija board" hidden>
      <div class="ends"><span>YES</span><span>☾</span><span>NO</span></div>
      <div id="letters" aria-hidden="true"></div>
      <div class="goodbye">GOOD BYE</div>
      <div id="planchette" aria-hidden="true">◉</div>
    </section>
    <form id="question-form">
      <div class="input-row">
        <input id="question" aria-label="Your question" name="question" maxlength="300" placeholder="What does tomorrow hold?" autocomplete="off" required>
        <button id="ask" type="submit">Ask the board</button>
      </div>
    </form>
    <section class="answer-panel" hidden>
      <p class="eyebrow">The board says</p>
      <p id="answer" aria-hidden="true"></p>
      <button id="another" type="button" hidden>Ask another question</button>
    </section>
    <p id="announcement" class="sr-only" role="status" aria-live="polite"></p>
    <section id="history" aria-labelledby="history-title" hidden>
      <div class="history-heading">
        <h2 id="history-title">History</h2>
        <button id="clear-history" class="text-button" type="button">Clear history</button>
      </div>
      <ol id="history-list"></ol>
    </section>
  </main>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
